name: PR Pipeline

on: [ pull_request, workflow_dispatch ]


concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:

  review:
    name: Review Pipeline
    uses: ./.github/workflows/step_review.yml
    with:
      PHP_VERSION: 8.2

  # ------------------------------------------------------------------------------------------------------------------------

  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v6
        with:
          path: MolliePayments

      - name: Create Cache Directories
        run: |
          mkdir -p ~/.build

      - name: Mount Build Cache
        uses: actions/cache@v6
        with:
          key: cache-build-${{ github.run_id }}
          path: ~/.build

      - name: Build Plugin
        uses: ./MolliePayments/.github/actions/build-plugin

  # Runs the same verifier the Shopware Store runs on upload, against the ZIP we
  # would actually submit. Separate job instead of a step in the build-plugin
  # action, because that action is shared with the E2E and nightly pipelines,
  # which only need the artifact.
  validate:
    name: Shopware Extension Verifier
    needs: build
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v6
        with:
          path: MolliePayments

      - name: Mount Build Cache
        uses: actions/cache@v6
        with:
          key: cache-build-${{ github.run_id }}
          path: ~/.build

      - name: Validate Release ZIP
        working-directory: MolliePayments
        run: make validate zip=$HOME/.build/MolliePayments.zip -B

  e2e:
    name: E2E Core | Shopware ${{ matrix.shopware }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shopware: '6.7.13.0'
            php: '8.4'
            image: 'dockware/shopware'
          - shopware: '6.7.12.2'
            php: '8.2'
            image: 'dockware/shopware'
          - shopware: '6.6.10.19'
            php: '8.2'
            image: 'dockware/shopware'
          - shopware: '6.5.8.19'
            php: '8.2'
            image: 'dockware/shopware'
    steps:

      - name: Clone Code
        uses: actions/checkout@v6

      - name: Mount Build Cache
        uses: actions/cache@v6
        with:
          key: cache-build-${{ github.run_id }}
          path: ~/.build

      - name: E2E Core Tests, Shopware ${{ matrix.shopware }}
        uses: ./.github/actions/run-e2e
        with:
            # -------------------------------------------
            SHOPWARE: ${{ matrix.shopware }}
            PHP: ${{ matrix.php }}
            IMAGE: ${{ matrix.image }}
            # -------------------------------------------
            MOLLIE_APIKEY_TEST: ${{ secrets.MOLLIE_APIKEY_TEST }}
            # -------------------------------------------
            RUN_CYPRESS: true
            TESTRAIL: false
            # Cypress always runs @core only on PRs — the full suite takes too long.
            FILTERS: "@core"
            # PHPUnit/Behat depend on the Mollie API key: fork PRs have none, so run only
            # the API-free 'core' group and skip Behat. When the key IS available (e.g. a
            # maintainer's own PR) run all integration tests and Behat.
            PHPUNIT_GROUPS: ${{ secrets.MOLLIE_APIKEY_TEST == '' && 'core' || '' }}
            RUN_BEHAT: ${{ secrets.MOLLIE_APIKEY_TEST != '' }}
