name: Step Report

on:
  workflow_call:
    inputs:
      PUBLISH:
        description: "Push the report to the gh-pages branch, which is what GitHub Pages serves. Only the master pipeline may do this - a pull request is not the state of the plugin, so it gets the report as a downloadable artifact instead."
        required: false
        default: false
        type: boolean

jobs:

  report:
    name: Allure Report
    runs-on: ubuntu-latest
    # Master and the nightly both publish, and both force-push the same branch. The gate
    # sits on the job, so a queued run does not even read the trend until the running one
    # has pushed its own. A run that only builds an artifact is never held up: its group
    # is unique.
    concurrency:
      group: ${{ inputs.PUBLISH && 'publish-gh-pages' || format('report-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:

      - name: Clone Code
        uses: actions/checkout@v6

      # Every test job uploads under this prefix. A missing one is not an error: a job that
      # was skipped simply leaves its environment out of the report.
      - name: Download Allure Results
        uses: actions/download-artifact@v7
        with:
          pattern: allure-results-*
          path: .reports/allure/stages

      # The report is rebuilt from scratch every run, so the only thing the branch has to
      # carry between runs is the trend data.
      - name: Clone Report Branch
        if: ${{ inputs.PUBLISH }}
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Report
        run: |
          npm install -g allure@^3

          mkdir -p .reports/allure/dumps

          # The trend chart is the reason to publish at all, so continue the history the
          # last master run left behind instead of starting over.
          cp gh-pages/history.jsonl .reports/allure/history.jsonl || true

          environments=""

          for stage in .reports/allure/stages/*/; do
            [ -d "$stage" ] || continue

            suffix=$(basename "$stage" | sed 's/^allure-results-//')
            id=$(printf '%s' "$suffix" | tr -c 'A-Za-z0-9_-' '_')
            environments="${environments}${id}=$(printf '%s' "$suffix" | tr '_' ' ');"

            # `allure run` records the results that appear while the wrapped command runs,
            # so unpacking the artifact has to BE that command.
            rm -rf .reports/allure/stage
            mkdir -p .reports/allure/stage

            allure run -c config/allurerc.mjs \
              --environment "$id" \
              --dump ".reports/allure/dumps/$id" \
              --results-dir .reports/allure/stage \
              -- cp -r "$stage." .reports/allure/stage/
          done

          ALLURE_ENVIRONMENTS="$environments" allure generate -c config/allurerc.mjs \
            --dump '.reports/allure/dumps/*.zip' \
            --history-limit 30

      # A pull request stays off gh-pages, so the published page always shows master. The
      # finished report is attached to the run instead, for whoever reviews the PR.
      - name: Upload Report
        if: ${{ !inputs.PUBLISH }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: .reports/allure/report
          retention-days: 14

      - name: Publish Report
        if: ${{ inputs.PUBLISH }}
        run: |
          # Shields.io has no idea what Allure is, so hand it a finished endpoint.
          node -e '
            const {stats = {}} = require("./.reports/allure/report/summary.json");
            const passed = stats.passed ?? 0;
            const failed = (stats.failed ?? 0) + (stats.broken ?? 0);

            require("fs").writeFileSync(".reports/allure/badge.json", JSON.stringify({
              schemaVersion: 1,
              label: "tests",
              message: failed > 0 ? passed + " passed, " + failed + " failed" : passed + " passed",
              color: failed > 0 ? "critical" : "success",
            }));
          '

          cd gh-pages

          # The state the trend was read from. The push may overwrite that and nothing
          # else - if another pipeline got there first, its history entries would be
          # dropped without a word, and a red job is the only way anyone would notice.
          base=$(git rev-parse HEAD)

          # Nothing on this branch is a source of truth - the report is derived from the
          # test results, the trend from the previous run - so the whole tree is replaced.
          # The report sits at the root, so the Pages base URL IS the report.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          cp -r "$GITHUB_WORKSPACE/.reports/allure/report/." .
          cp "$GITHUB_WORKSPACE/.reports/allure/history.jsonl" history.jsonl
          cp "$GITHUB_WORKSPACE/.reports/allure/badge.json" badge.json

          # Pages runs the tree through Jekyll otherwise, which drops every file Allure
          # writes into an underscore-prefixed path.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One root commit per publish. Without it the branch would keep every report it
          # ever served in its object database, and deleting the files would not help.
          git checkout --orphan publish
          git add -A
          git commit -m "Test report for ${{ github.sha }}"
          git push --force-with-lease=gh-pages:"$base" origin publish:gh-pages

      - name: Link Report
        if: ${{ inputs.PUBLISH }}
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "[Test report]($url)" >> "$GITHUB_STEP_SUMMARY"
