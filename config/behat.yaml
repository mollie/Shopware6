default:
  # Registers the Cucumber JSON formatter without enabling it - `make behat allure=<dir>`
  # selects it. Allure reads that format directly, including every Given/When/Then step.
  # Ours, because the vendor formatter reports every row of an Examples table under the same
  # name - see tests/Behat/Formatter/ExampleRowFormatter.php.
  extensions:
    Mollie\Shopware\Behat\Formatter\ExampleRowExtension: ~
  suites:
    default:
      paths:
        features: '%paths.base%/../tests/Behat/Features'
      contexts:
        - Mollie\Shopware\Behat\Context\BootstrapContext
        - Mollie\Shopware\Behat\Context\PaymentContext
        - Mollie\Shopware\Behat\Context\ShippingContext
        - Mollie\Shopware\Behat\Context\CustomerContext
        - Mollie\Shopware\Behat\Context\CheckoutContext
        - Mollie\Shopware\Behat\Context\SubscriptionContext
        - Mollie\Shopware\Behat\Context\RefundContext