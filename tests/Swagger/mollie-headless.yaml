openapi: "3.0.0"

info:
  title: "Mollie Headless API"
  version: "1.0"
  description: "This is a Swagger Template for all Headless cases of the Mollie plugin.<br /><br />Instructions:<ol><li>Configure the correct server domain, where your Shopware Store API ist available.</li><li>Click on Authorize and fill in the Access Key from your Sales Channel.</li><li>Then use the Cart request for Shopware to retrieve an Access-Token</li><li>Just copy the Access-Token and use it in the global authorize section too.</li></ol><br />Congratulations, you can now use the API requests."

servers:
  - url: /
  - url: https://localhost
  - url: http://localhost
  - url: '{custom}'
    variables:
      custom:
        default: https://localhost

externalDocs:
  description: "Find out more about Mollie Shopware"
  url: "https://github.com/mollie/Shopware6/wiki"

paths:

  /store-api/account/login:
    post:
      tags:
        - "Account"
      summary: "Login with a customer"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  default: ""
                password:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/checkout/cart:
    get:
      tags:
        - "Cart"
      summary: "Get your current cart"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/checkout/cart/line-item:
    post:
      tags:
        - "Cart"
      summary: "Add a line item to your cart"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        default: "product"
                      referencedId:
                        default: "#"
                      quantity:
                        default: "1"
      responses:
        "200":
          description: "successful operation"

  /store-api/payment-method:
    post:
      tags:
        - "Cart"
      summary: "Loads all available payment methods for your cart"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                onlyAvailable:
                  default: "true"
                associations:
                  type: array
      responses:
        "200":
          description: "successful operation"

  /store-api/checkout/order:
    post:
      tags:
        - "Cart"
      summary: "Places the order"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/handle-payment:
    post:
      tags:
        - "Cart"
      summary: "Starts a payment for the previously placed order"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  default: "#"
                finishUrl:
                  default: ""
                errorUrl:
                  default: ""

      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/config:
    get:
      tags:
        - "Mollie Config"
      summary: "Gets the basic Mollie configuration like Profile IDs and more for component integration."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/creditcard/store-token/{customerId}/{cardToken}:
    post:
      tags:
        - "Credit Card"
      summary: "Save the card token from Mollie for an upcoming payment in Shopware"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
        - name: "cardToken"
          in: "path"
          description: "Credit Card Token from the Mollie API Response"
          required: true
        - name: "shouldSaveCardDetail"
          in: "path"
          description: "(optional) If provided with TRUE, the credit card data will lead to a new reusable mandate inside Mollie for this customer."
          required: false
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/creditcard/store-mandate-id/{customerId}/{mandateId}:
    post:
      tags:
        - "Credit Card"
      summary: "Save the mandate id that should be used for the upcoming credit card payment."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
        - name: "mandateId"
          in: "path"
          description: "Mandate ID from the Mollie that should be used for the payment."
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/ideal/issuers:
    get:
      tags:
        - "iDEAL"
      summary: "Gets a list of available iDEAL issuers"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/ideal/store-issuer/{customerId}/{issuerId}:
    post:
      tags:
        - "iDEAL"
      summary: "Save the selected issuer for an upcoming payment in Shopware"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
        - name: "issuerId"
          in: "path"
          description: "Mollie Issuer ID of Mollie, e.g. ideal_ABNANL2A, ..."
          required: true
      responses:
        "200":
          description: "successful operation"


  /store-api/mollie/pos/terminals:
    get:
      tags:
        - "POS"
      summary: "Gets a list of available POS terminals"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/pos/store-terminal/{customerId}/{terminalId}:
    post:
      tags:
        - "POS"
      summary: "Save the selected terminal for an upcoming payment in Shopware"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
        - name: "terminalId"
          in: "path"
          description: "Mollie Terminal ID of Mollie, e.g. term_X9X..., ..."
          required: true
      responses:
        "200":
          description: "successful operation"


  /store-api/mollie/applepay/enabled:
    get:
      tags:
        - "Apple Pay Direct"
      summary: "Gets if Apple Pay Direct is enabled and available for this Sales Channel"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/id:
    get:
      tags:
        - "Apple Pay Direct"
      summary: "Gets the ID of Apple Pay Direct in case you need to hide it"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/add-product:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "(optional) Adds a new product to the Apple Pay Direct cart. Skip this step if you want to proceed with the current Shopware cart of the user"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  default: ""
                quantity:
                  default: 1
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/cart:
    get:
      tags:
        - "Apple Pay Direct"
      summary: "Gets the current prepared and formatted Apple Pay Direct cart"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/validate:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "Should be used in the Apple Pay form as a merchant validation route"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                validationUrl:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/shipping-methods:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "Gets a list of available and formatted Apple Pay Direct shipping methods"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countryCode:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/shipping-method:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "Sets a provided shipping method for the Apple Pay Direct cart"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/pay:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "Use this to create an order and start the payment process after getting the Apple Pay payment token and customer data"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  default: ""
                firstname:
                  default: ""
                lastname:
                  default: ""
                street:
                  default: ""
                city:
                  default: ""
                postalCode:
                  default: ""
                countryCode:
                  default: ""
                paymentToken:
                  default: ""
                finishUrl:
                  default: ""
                errorUrl:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/applepay/restore-cart:
    post:
      tags:
        - "Apple Pay Direct"
      summary: "(Optional) Restores the original Shopware cart. Use this on Apple Pay cancellation events. You only need this, if you have used the add-product route before."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"


  /store-api/mollie/paypal-express/start:
    get:
      tags:
        - "PayPal Express"
      summary: "Creates the Mollie session for PayPal Express and returns the url the customer has to be sent to"
      description: "Pass redirectUrl and cancelUrl, otherwise PayPal returns the customer to storefront routes that do not exist in a headless shop. Both are pages of your own frontend: on redirectUrl call the finish route with your context token to create the guest account, on cancelUrl restore your cart."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "query"
          name: "redirectUrl"
          description: "Page of your frontend PayPal returns the customer to after the approval"
        - in: "query"
          name: "cancelUrl"
          description: "Page of your frontend PayPal returns the customer to when they cancel"
        - in: "query"
          name: "acceptedDataProtection"
          description: "1 when the customer accepted the data protection, needed when the shop requires it for a guest registration"
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/paypal-express/finish:
    get:
      tags:
        - "PayPal Express"
      summary: "Creates the guest account from the PayPal data and puts the session on the cart, so the customer can confirm the order"
      description: "Call this from your redirectUrl page with the context token you started the checkout with. The response carries the new context token of the guest customer - use that one from here on. No order is created, the customer still has to go through your confirm step."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/paypal-express/cancel:
    get:
      tags:
        - "PayPal Express"
      summary: "Drops the PayPal Express session and restores the cart the customer started from"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/express-components/create-session:
    post:
      tags:
        - "Express Components"
      summary: "Creates the Mollie session for the express component and returns the client access token to mount it with"
      description: "Call this before rendering the express component. Without an orderId the session is built from the cart of the current context token, with an orderId from that order - the flow of a failed payment, where the order already exists. That order has to belong to the logged in customer of the context token. Where the component may be shown is your decision: restrictions lists the places the merchant switched it off in. sessionId and clientAccessToken come back empty when the merchant switched the component off entirely or the cart is empty - do not render it then. finishUrl and errorUrl are the pages of your frontend the customer is sent to after the payment; {orderId} in them is replaced with the id of the order. Pass them here, not to the finish route: Mollie redirects the browser back on its own and nothing you put in this request survives that redirect."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  default: ""
                finishUrl:
                  type: string
                  default: ""
                errorUrl:
                  type: string
                  default: ""
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  restrictions:
                    type: array
                    items:
                      type: string
                      enum: [ "pdp", "plp", "offcanvas", "cart", "register", "confirm" ]
                  sessionId:
                    type: string
                  clientAccessToken:
                    type: string

  /store-api/mollie/subscription:
    get:
      tags:
        - "Subscriptions"
      summary: "Gets all confirmed subscriptions of the current account."
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/billing/update:
    post:
      tags:
        - "Subscriptions"
      summary: "Updates the billing address of a subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                salutationId:
                  default: ""
                title:
                  default: ""
                firstName:
                  default: ""
                lastName:
                  default: ""
                company:
                  default: ""
                department:
                  default: ""
                additionalField1:
                  default: ""
                additionalField2:
                  default: ""
                phoneNumber:
                  default: ""
                street:
                  default: ""
                zipcode:
                  default: ""
                city:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/shipping/update:
    post:
      tags:
        - "Subscriptions"
      summary: "Updates the shipping address of a subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                salutationId:
                  default: ""
                title:
                  default: ""
                firstName:
                  default: ""
                lastName:
                  default: ""
                company:
                  default: ""
                department:
                  default: ""
                additionalField1:
                  default: ""
                additionalField2:
                  default: ""
                phoneNumber:
                  default: ""
                street:
                  default: ""
                zipcode:
                  default: ""
                city:
                  default: ""
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/payment/update:
    post:
      tags:
        - "Subscriptions"
      summary: "Starts the update process of the payment method for a subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectUrl:
                  default: "https://localhost/return-xyz"
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/pause:
    post:
      tags:
        - "Subscriptions"
      summary: "Pauses a running subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/resume:
    post:
      tags:
        - "Subscriptions"
      summary: "Resumes a paused subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/skip:
    post:
      tags:
        - "Subscriptions"
      summary: "Skips a running subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/subscription/{subscriptionId}/cancel:
    post:
      tags:
        - "Subscriptions"
      summary: "Cancels a running subscription"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware subscription that will be updated"
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/mandates/{customerId}:
    get:
      tags:
        - "Mandates"
      summary: "Gets all available mandates of the provided customer"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
      responses:
        "200":
          description: "successful operation"

  /store-api/mollie/mandate/revoke/{customerId}/{mandateId}:
    post:
      tags:
        - "Mandates"
      summary: "Revokes and deletes the saved card with the provided mandate ID inside Mollie"
      security:
        - AccessKey: [ ]
        - AccessToken: [ ]
      parameters:
        - name: "customerId"
          in: "path"
          description: "Shopware Customer ID"
          required: true
        - name: "mandateId"
          in: "path"
          description: "Mandate ID from the Mollie that should be removed."
          required: true
      responses:
        "200":
          description: "successful operation"

  /api/mollie/express-components/finish/{salesChannelId}:
    get:
      tags:
        - "Express Components"
      summary: "Where Mollie sends the customer back to after the express component payment. Mollie calls this, you do not"
      description: "This url is built when the session is created and handed to Mollie, so there is nothing to call here yourself. It creates the guest account and the order, finalizes the payment and then redirects the browser to the finishUrl you passed to create-session, or to the errorUrl when something went wrong. It carries no authentication, because a browser redirect cannot send the sw-access-key header."
      parameters:
        - in: "path"
          name: "salesChannelId"
          description: "ID of the Shopware Sales Channel the session was created in"
          required: true
        - in: "query"
          name: "cartToken"
          description: "Context token of the cart the session was created from"
        - in: "query"
          name: "orderId"
          description: "ID of the order the session was created from, instead of a cartToken"
        - in: "query"
          name: "finishUrl"
          description: "Page of your frontend the customer is redirected to after a successful payment"
        - in: "query"
          name: "errorUrl"
          description: "Page of your frontend the customer is redirected to when the checkout could not be finished"
      responses:
        "302":
          description: "redirect to the finishUrl or the errorUrl"

  /api/mollie/webhook/{transactionId}:
    post:
      tags:
        - "Webhooks"
      summary: "Sends a payment status update webhook to Shopware"
      parameters:
        - in: "path"
          name: "transactionId"
          description: "ID of the Shopware Transaction that will be updated"
          required: true
      responses:
        "200":
          description: "successful operation"

  /api/mollie/webhook/subscription/{subscriptionId}:
    post:
      tags:
        - "Webhooks"
      summary: "Start a subscription renewal or update an existing subscription order and payment status."
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware Subscription"
          required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: "The matching transaction ID of Mollie that was captured. tr_xyz, ..."
      responses:
        "200":
          description: "successful operation"

  /api/mollie/webhook/subscription/{subscriptionId}/mandate/update:
    post:
      tags:
        - "Webhooks"
      summary: "Updates the mandate for the subscription after an initial update-payment-method action from the customer."
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware Subscription"
          required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: "The matching transaction ID of Mollie that was used with the 0,00 amount payment. tr_xyz, ..."
      responses:
        "200":
          description: "successful operation"

  /api/mollie/webhook/subscription/{subscriptionId}/renew:
    post:
      tags:
        - "Webhooks (Legacy)"
      summary: "Start a subscription renewal or update an existing subscription order and payment status. This was a misleading name and is now a legacy URL but still required for old payments."
      parameters:
        - in: "path"
          name: "subscriptionId"
          description: "ID of the Shopware Subscription"
          required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: "The matching transaction ID of Mollie that was captured. tr_xyz, ..."
      responses:
        "200":
          description: "successful operation"



components:
  securitySchemes:
    AccessKey:
      type: apiKey
      in: header
      name: sw-access-key
    AccessToken:
      type: apiKey
      in: header
      name: sw-context-token
